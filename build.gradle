plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = 'com.magikal_hakase'
base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vendor'} (${System.getProperty 'java.vm.version'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tokyometroaddon {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tokyometroaddon {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                tokyometroaddon {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        // Aliyun mirror of Maven Central (faster / more reliable on CN networks)
        url = 'https://maven.aliyun.com/repository/public'
    }
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MTR 3.x (1.20.1 Forge): Minecraft Transit Railway 3.2.2-hotfix-2.
    // The Forge build is already Mojang-mapped (verified), so no deobf is needed.
    // Local jar (official Modrinth build) kept in libs/ so the build is reproducible.
    implementation files('libs/MTR-forge-1.20.1-3.2.2-hotfix-2.jar')
}

processResources {
    def expandProps = [
            "version"           : mod_version,
            "group"             : project.group,
            "minecraft_version" : minecraft_version,
            "forge_version"     : forge_version,
            "mod_authors"       : mod_authors,
            "mod_description"   : mod_description,
            "mod_license"       : mod_license,
            "mod_id"            : mod_id,
            "mod_name"          : mod_name
    ]
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
